<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dead Miles - Grape & amber, animated</title>
<style>
  @font-face { font-family: Out; src: url(fonts/Outfit-Regular.ttf); font-weight: 400; }
  @font-face { font-family: Out; src: url(fonts/Outfit-Bold.ttf); font-weight: 800; }
  * { box-sizing: border-box; } body { margin: 0; background: #0b0a14; font-family: Out, system-ui, sans-serif; display: flex; justify-content: center; padding: 24px; }
  .ph { --bg: radial-gradient(120% 70% at 50% 0%, #4a3480, #2a1d4c 60%, #1a1232); --card: rgba(34,24,62,.9); --deep: #150e2a; --line: #4a3c70;
    --c1: #ffb347; --c2: #ff7a59; --c3: #c9a8ff; --txt: #f6efff; --hi: #fff; --mute: #b3a6d6; --btnTxt: #1a1232;
    position: relative; width: 390px; height: 844px; border-radius: 44px; overflow: hidden; border: 3px solid #26213e; background: var(--bg); color: var(--txt); padding: 50px 18px 0; }
  .hrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; } .hrow svg { height: 40px; }
  .pill { padding: 5px 9px; border-radius: 99px; border: 2px solid var(--c3); color: var(--c3); font: 800 12px Out; white-space: nowrap; box-shadow: 0 0 12px rgba(201,168,255,.45), inset 0 0 8px rgba(201,168,255,.25); }
  .hero { position: relative; margin: 14px 0 14px; height: 216px; border-radius: 28px; border: 2px solid var(--c2); background: var(--card); overflow: hidden; box-shadow: 0 0 16px rgba(255,122,89,.45), inset 0 0 26px rgba(255,122,89,.12); }
  .hero canvas#scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .steps { position: absolute; right: 18px; top: 18px; text-align: right; }
  .steps b { display: block; font: 800 46px/1 Out; color: var(--hi); text-shadow: 0 0 14px var(--c2), 0 2px 0 #1a1232; } .steps span { font: 800 13px Out; color: var(--c1); text-shadow: 0 1px 0 #1a1232; }
  .bubble { position: absolute; left: 22px; top: 16px; padding: 6px 10px; border-radius: 14px; background: rgba(21,14,42,.85); border: 2px solid var(--c3); font: 800 12px Out; color: var(--hi); }
  .bar { position: absolute; right: 18px; width: 150px; top: 108px; height: 12px; border-radius: 9px; background: var(--deep); border: 2px solid var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 74%; background: linear-gradient(90deg, var(--c2), var(--c1)); box-shadow: 0 0 12px var(--c2); }
  .barl { position: absolute; right: 18px; top: 90px; font: 800 11px Out; color: var(--mute); text-shadow: 0 1px 0 #1a1232; }
  h3 { margin: 6px 4px 10px; font: 800 15px Out; color: var(--mute); letter-spacing: 2px; text-transform: uppercase; }
  .do { --c: var(--c1); display: flex; align-items: center; gap: 14px; margin-bottom: 10px; padding: 13px 15px; border-radius: 20px; background: var(--card); border: 2px solid var(--c); box-shadow: 0 0 14px color-mix(in srgb, var(--c) 40%, transparent); }
  .do.b { --c: var(--c2); } .do.c { --c: var(--c3); }
  .do .e { font-size: 30px; } .do b { display: block; font: 800 18px Out; } .do .s { font: 400 13px Out; color: var(--mute); }
  .go { margin-left: auto; padding: 9px 16px; border-radius: 14px; background: var(--c); color: var(--btnTxt); font: 800 15px Out; }
  .nav { position: absolute; left: 14px; right: 14px; bottom: 18px; height: 78px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; border-radius: 28px; background: var(--card); border: 2px solid var(--line); }
  .nav a { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; font: 800 12px Out; color: var(--mute); } .nav a .e { font-size: 26px; filter: grayscale(.55) opacity(.75); }
  .nav a.on { color: var(--c1); text-shadow: 0 0 8px var(--c1); } .nav a.on .e { filter: drop-shadow(0 0 8px var(--c1)); }
  .nav a .dot { position: absolute; top: -2px; right: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--c1); box-shadow: 0 0 8px var(--c1); }
</style></head><body>
<canvas id="cv" width="1" height="1" style="display:none"></canvas>
<div class="ph">
  <div class="hrow"><div class="logo" id="logo"></div><div class="pill">🧟 Horde in 6d</div></div>
  <div class="hero"><canvas id="scene" width="708" height="432"></canvas>
        <div class="steps"><b>6,420</b><span>steps today</span></div><div class="barl">next house at 7,000</div><div class="bar"><i></i></div></div>
  <h3>Today</h3>
  <div class="do"><span class="e">🏚️</span><div><b>3 houses to loot</b><span class="s">one is a pharmacy</span></div><span class="go">Go</span></div>
  <div class="do b"><span class="e">🃏</span><div><b>Card pack ready</b><span class="s">you hit 10,000 steps</span></div><span class="go">Open</span></div>
  <div class="do c"><span class="e">🛡️</span><div><b>Horde on Sunday</b><span class="s">take a watch shift</span></div><span class="go">Shift</span></div>
  <div class="nav"><a class="on"><span class="e">🏠</span>Home</a><a><span class="e">🏚️</span>Loot<span class="dot"></span></a><a><span class="e">🗺️</span>Map</a><a><span class="e">🎒</span>Bag</a><a><span class="e">⭐</span>Me<span class="dot"></span></a></div>
</div>
<script src="../../next/s2art.js"></script>
<script src="../../next/art.js"></script>
<script>window.DM = window.DM || {};</script>
<script src="../../next/events.js"></script>
<script src="../../next/data.js"></script>
<script src="../../next/engine.js"></script>
<script src="../../next/crew.js"></script>
<script src="../../next/logo.js"></script>
<script>
document.getElementById('logo').innerHTML = DM.Logo.mini(true);
const cv = document.getElementById('scene'), x = cv.getContext('2d'), W = cv.width, H = cv.height, S = 2;   // drawn at 2x
const pet = { kind: 'cat', coat: 0, xp: 300, name: 'Mochi' };
const tmp = document.createElement('canvas'); tmp.width = 180; tmp.height = 120;
let ready = false;
// the skyline: a row of rowhouses that scrolls past while she walks
const B = []; { let px = 0, i = 0; while (px < W * 2) { const w = 70 + (i * 37) % 60, h = 120 + (i * 53) % 110; B.push({ x: px, w, h, win: (i * 7) % 3 }); px += w + 6; i++; } }
const CITYW = B.reduce((a, b) => Math.max(a, b.x + b.w), 0) + 6;
function draw(t) {
  x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, W, H);
  // sky + moon
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#3a2868'); g.addColorStop(1, '#5a3a7a'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(255,214,140,.15)'; x.beginPath(); x.arc(W * .44, 64, 52, 0, 6.28); x.fill(); x.fillStyle = 'rgba(255,214,140,.9)'; x.beginPath(); x.arc(W * .44, 64, 30, 0, 6.28); x.fill();
  const ground = H - 46, speed = 60;   // px per second at 2x
  // far skyline (slow)
  const o1 = (t * speed * .35) % CITYW;
  for (const k of [0, 1]) for (const b of B) { const bx = b.x - o1 + k * CITYW; if (bx > W || bx + b.w < 0) continue;
    x.fillStyle = '#2a1d4c'; x.strokeStyle = '#11142f'; x.lineWidth = 4; x.fillRect(bx, ground - b.h, b.w, b.h); x.strokeRect(bx, ground - b.h, b.w, b.h);
    for (let r = 0; r < 3; r++) for (let c = 0; c < 2; c++) { const lit = (b.win + r + c) % 3 === 0; x.fillStyle = lit ? '#ffb347' : '#3d2d61'; x.fillRect(bx + 14 + c * (b.w / 2 - 6), ground - b.h + 16 + r * 26, 14, 16); } }
  // sidewalk + dashes (fast)
  x.fillStyle = '#4a3c70'; x.fillRect(0, ground, W, 24); x.fillStyle = '#11142f'; x.fillRect(0, ground, W, 4);
  x.fillStyle = '#231a40'; x.fillRect(0, ground + 24, W, H - ground - 24);
  const o2 = (t * speed) % 80; x.fillStyle = '#ffb347'; for (let dx = -o2; dx < W; dx += 80) x.fillRect(dx, ground + 34, 40, 5);
  for (let dx = -((t * speed) % 120); dx < W; dx += 120) { x.fillStyle = '#3d2d61'; x.fillRect(dx, ground + 4, 3, 20); }
  if (!ready) return;
  // her: a walk cycle (legs, arms, head bob), as in a house run
  const ph = t * 7.5, s = Math.sin(ph), cx = W * .22, fy = ground + 10, yo = -Math.abs(Math.cos(ph)) * 8;
  x.fillStyle = 'rgba(8,6,22,.4)'; x.beginPath(); x.ellipse(cx, fy, 54, 11, 0, 0, 6.28); x.fill();
  ART.drawRig(x, 'mock', cx, fy + yo, 1.12, false, { rot: Math.sin(ph * .5) * .02, parts: { legB: { r: s * .42 }, legF: { r: -s * .42 }, arm: { r: -s * .3 }, bat: { r: -s * .3 }, head: { r: Math.sin(ph * .5) * .06 } }, weapon: 'fists' });
  // the pet trots beside her (the game's own pet art and walk)
  DM.Crew.petPortrait(tmp, pet, { sit: false, move: 1, ph: t * 9, t, sc: 2.3, happy: true });
  x.drawImage(tmp, cx + 46, fy - 108, 180, 120);
}
(async () => {
  await document.fonts.ready;
  const look = ART.LOOK.norm({ hair: 1, hairC: 4, coat: 6, mouth: 1 });
  try { await ART.buildRig('survivor', 2, ART.LOOK.recolor(look), 'mock', ART.LOOK.patch(look)); ready = true; } catch (e) { console.warn('rig', e); }
  window.__ready = true;
  if (!window.__manual) { const t0 = performance.now(); const loop = n => { draw((n - t0) / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
})();
window.__draw = draw;
</script>
</body></html>
