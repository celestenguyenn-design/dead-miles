<style>
html,body{margin:0;padding:0;background:#08070e;overflow:hidden}
#wrap{position:relative;width:390px;height:520px;overflow:hidden}
canvas{position:absolute;left:-1px;top:0;width:392px;height:520px;image-rendering:pixelated;image-rendering:crisp-edges}
</style></head>
<body><div id="wrap"><canvas id="c" width="98" height="130"></canvas></div>
<script>
// ---------- palette (20 colours) ----------
const PAL = [
 '#08070e', // 0 void
 '#121220', // 1 night
 '#1c1f34', // 2 navy
 '#2c3152', // 3 slate dark
 '#47527c', // 4 slate
 '#8090b6', // 5 moon-cool light
 '#2a191e', // 6 brick shadow
 '#4a2a29', // 7 brick
 '#7a4536', // 8 brick lit
 '#bb7148', // 9 sodium orange
 '#f2bf66', // 10 lamp yellow
 '#fff0c4', // 11 hot white
 '#e3a37f', // 12 skin
 '#a9ba86', // 13 zombie light
 '#5f7b5c', // 14 zombie mid
 '#33473c', // 15 zombie dark
 '#c93c50', // 16 red
 '#6c1f34', // 17 red dark
 '#2f7d82', // 18 teal
 '#174649', // 19 teal dark
 '#5b4b52', // 20 warm grey
 '#93766a', // 21 warm tan
].map(h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]);

const W = 98, H = 130;
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(r => r.map(v => (v + .5) / 16));
const RAMP = {
  sky:    [0,1,2,3],
  brick:  [0,6,7,8,9,10],
  brick2: [0,1,6,7,8,9],
  stone:  [0,1,2,3,20,21,10],
  trim:   [0,1,2,3,4,20,21],
  asph:   [0,1,2,3,20,9],
  glass:  [0,1,2,3,4],
  iron:   [0,1,2,3,20,9],
  door:   [0,6,17,7,8,9],
  can:    [0,1,2,3,4,5],
  warm:   [7,9,10,11],
  plank:  [0,6,20,21,9],
  brown:  [0,6,7,20,21,10],
};
const buf = new Array(W * H).fill(0);
const put = (x, y, c) => { if (x >= 0 && y >= 0 && x < W && y < H) buf[y * W + x] = c; };
const get = (x, y) => (x >= 0 && y >= 0 && x < W && y < H) ? buf[y * W + x] : -1;
const dith = (x, y, ramp, L) => {
  const r = RAMP[ramp]; L = Math.max(0, Math.min(.999, L));
  let i = Math.floor(L * (r.length - 1) + BAYER[y & 3][x & 3]);
  return r[Math.max(0, Math.min(r.length - 1, i))];
};

// ---------- lighting ----------
const LX = 52, LY = 23;   // lamp head
const GROUND = 97;        // top of sidewalk
function lampLight(x, y) {
  // wall light: radial falloff from lamp head
  const dx = x - LX, dy = y - LY;
  let d = Math.sqrt(dx * dx + dy * dy * 1.3);
  let l = Math.max(0, 1 - d / 46);
  return l * l;
}
function poolLight(x, y) {
  const dx = (x - LX) / 36, dy = (y - 104) / 10;
  let l = Math.max(0, 1 - Math.sqrt(dx * dx + dy * dy));
  return Math.pow(l, 1.2);
}
function cone(x, y) {
  if (y < LY + 3 || y > 108) return 0;
  const t = (y - LY - 3) / (108 - LY - 3);
  const half = 3 + t * 30;
  const dx = Math.abs(x - LX);
  if (dx > half) return 0;
  return (1 - dx / half) * .22 * (0.5 + .5 * t);
}

// ---------- background ----------
const hash = (x, y) => { let h = x * 374761393 + y * 668265263; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967296; };

for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  let c;
  const L0 = lampLight(x, y);
  if (y < GROUND) {
    // facade: house A (x<62) brownstone brick, house B (x>=62) darker brick
    const houseB = x >= 63;
    let ramp = houseB ? 'brick2' : 'brick';
    let base = .17;
    // brick courses
    const row = Math.floor(y / 3), off = (row & 1) ? 2 : 0;
    const mortar = (y % 3 === 2) || ((x + off) % 6 === 0);
    if (mortar) base -= .07;
    base += (hash(Math.floor((x + off) / 6), row) - .5) * .06;
    // cornice
    if (y < 7) { ramp = 'trim'; base = y < 2 ? .1 : (y === 6 ? .12 : .22 - (y % 2) * .04); }
    // party wall seam
    if (x === 62 || x === 63) { ramp = 'trim'; base = .08; }
    // lintel/sill bands
    c = dith(x, y, ramp, base + L0 * .75 + cone(x, y) * .6);
    buf[y * W + x] = c;
  } else if (y < 112) {
    // sidewalk slabs
    let base = .16 + (y - GROUND) * .004;
    if ((x % 18 === 5) || y === 104) base -= .08;
    base += (hash(x, y) - .5) * .05;
    buf[y * W + x] = dith(x, y, 'stone', base + poolLight(x, y) * .78 + cone(x, y) * .25);
  } else if (y < 115) {
    // curb
    let base = y === 112 ? .55 : .22;
    buf[y * W + x] = dith(x, y, 'trim', base * (.5 + poolLight(x, 106) * 1.2));
  } else {
    // wet asphalt
    let base = .12 + (hash(x, y) - .5) * .06;
    // lamp reflection streak
    const rx = Math.abs(x - LX);
    let refl = Math.max(0, 1 - rx / (3 + (y - 115) * .35)) * (1 - (y - 115) / 22);
    if ((y & 1) && hash(x, y >> 1) > .6) refl *= .4;
    buf[y * W + x] = dith(x, y, 'asph', base + refl * .9 + poolLight(x, y - 8) * .25);
  }
}

// rect helper with lighting
function fillLit(x0, y0, x1, y1, ramp, base, k = .7) {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++)
    put(x, y, dith(x, y, ramp, base + lampLight(x, y) * k + cone(x, y) * .5));
}

// ---- windows ----
function windowAt(x0, y0, w, h, lit) {
  // stone surround (lintel + sill)
  fillLit(x0 - 2, y0 - 3, x0 + w + 1, y0 - 1, 'trim', .3);
  fillLit(x0 - 1, y0 + h, x0 + w, y0 + h + 1, 'trim', .32);
  for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) {
    let c;
    if (lit) {
      // warm inside, blinds half drawn & broken
      const blind = y < y0 + 6 && !(x === x0 + 4 && y > y0 + 2);
      c = blind ? ((y & 1) ? 9 : 8) : dith(x, y, 'warm', .35 + (y - y0) / h * .3);
    } else {
      // dark glass with cool reflection streak
      const streak = (x - x0 + (y - y0)) % 9 < 2 ? .25 : 0;
      c = dith(x, y, 'glass', .15 + streak + lampLight(x, y) * .3);
    }
    if (x === x0 + Math.floor(w / 2) || y === y0 + Math.floor(h / 2)) c = 1; // muntins
    put(x, y, c);
  }
  // outline
  for (let x = x0 - 1; x <= x0 + w; x++) { put(x, y0 - 1, 0); }
  for (let y = y0; y < y0 + h; y++) { put(x0 - 1, y, 0); put(x0 + w, y, 0); }
}
windowAt(6, 12, 9, 15, false);
windowAt(25, 12, 9, 15, false);
windowAt(44, 12, 9, 15, false);
windowAt(70, 12, 9, 15, true);   // one survivor's window still lit
windowAt(86, 12, 9, 15, false);
windowAt(25, 45, 9, 17, false);
windowAt(44, 45, 9, 17, false);
windowAt(70, 45, 9, 17, false);
windowAt(86, 45, 9, 17, false);
// boarded window planks over lower right window
for (let i = 0; i < 3; i++) {
  for (let x = 68; x <= 81; x++) {
    const y = 49 + i * 5 + Math.round((x - 68) * (i === 1 ? -.25 : .15));
    put(x, y, dith(x, y, 'plank', .5 + lampLight(x, y) * .5)); put(x, y + 1, dith(x, y + 1, 'plank', .25 + lampLight(x, y) * .4)); put(x, y + 2, 0);
  }
}
// spraypaint tag on house B: an X
for (let i = 0; i < 9; i++) { put(86 + i, 66 + i, 16); put(94 - i, 66 + i, 16); if (i % 3 === 0) put(86 + i, 67 + i, 17); }

// ---- stoop + door (left) ----
// door surround
fillLit(2, 38, 18, 41, 'trim', .3);
for (let y = 42; y < 70; y++) for (let x = 3; x <= 17; x++) {
  let c;
  if (x === 3 || x === 17) c = dith(x, y, 'trim', .28 + lampLight(x, y) * .5);
  else if (x === 4 || x === 16) c = 0;
  else {
    // double door, panels
    const panel = (y > 45 && y < 54) || (y > 57 && y < 66);
    const px = x - 5; // 0..10
    const inner = panel && (px % 6 > 0) && (px % 6 < 5);
    c = dith(x, y, 'door', (inner ? .28 : .42) + lampLight(x, y) * .6 - (x === 10 ? .2 : 0));
    if (x === 10) c = 0;
  }
  put(x, y, c);
}
// transom glow
for (let x = 5; x <= 15; x++) { put(x, 42, 0); put(x, 43, (x & 1) ? 1 : 2); put(x, 44, 0); }
put(9, 61, 10); put(11, 61, 10); // knobs
// stoop steps
for (let s = 0; s < 9; s++) {
  const y = 70 + s * 3, xe = 21 + s * 2;
  for (let x = 0; x <= xe; x++) {
    put(x, y, dith(x, y, 'brown', .62 + lampLight(x, y) * .5 - (x < 3 ? .2 : 0)));  // tread nose (lit)
    put(x, y + 1, dith(x, y + 1, 'brown', .3 + lampLight(x, y) * .4));             // riser
    put(x, y + 2, dith(x, y + 2, 'brown', .18 + lampLight(x, y) * .3));
  }
  put(xe + 1, y, 0); put(xe + 1, y + 1, 0); put(xe + 1, y + 2, 0);
}
// iron railing (diagonal) with balusters
for (let s = 0; s <= 26; s++) {
  const x = 19 + Math.round(s * .66 * 1.5), y = 58 + s;
  if (x > 40) break;
  put(x, y, dith(x, y, 'iron', .55 + lampLight(x, y))); put(x, y - 1, 0); put(x, y + 1, 0);
  if (s % 4 === 0) for (let k = 2; k < 10; k++) { put(x, y + k, dith(x, y + k, 'iron', .4 + lampLight(x, y))); put(x + 1, y + k, 0); }
}
// newel post
for (let y = 82; y < GROUND + 3; y++) { put(37, y, 0); put(38, y, dith(38, y, 'iron', .3 + lampLight(38, y))); put(39, y, 0); }
put(37, 81, 0); put(38, 80, 0); put(38, 81, 9); put(39, 81, 0);

// ---- streetlamp ----
for (let y = 22; y < 108; y++) {
  put(LX - 1, y, 0);
  put(LX, y, dith(LX, y, 'iron', .22 + (y > 95 ? .1 : 0) + poolLight(LX, y) * .3));
  put(LX + 1, y, dith(LX + 1, y, 'iron', .5 + poolLight(LX, y) * .3));
  put(LX + 2, y, 0);
}
// base
for (let y = 101; y < 108; y++) for (let x = LX - 3; x <= LX + 4; x++) put(x, y, (x === LX - 3 || x === LX + 4) ? 0 : dith(x, y, 'iron', .3 + (x > LX ? .3 : 0)));
for (let x = LX - 3; x <= LX + 4; x++) put(x, 100, 0);
// arm & head
for (let x = LX - 2; x <= LX + 3; x++) { put(x, 17, 0); put(x, 18, dith(x, 18, 'iron', .4)); put(x, 19, dith(x, 19, 'iron', .25)); }
for (let x = LX - 4; x <= LX + 5; x++) put(x, 20, 0);
for (let x = LX - 3; x <= LX + 4; x++) { put(x, 21, 11); put(x, 22, (x > LX - 3 && x < LX + 4) ? 11 : 10); }
put(LX - 3, 23, 10); put(LX + 4, 23, 10);
for (let x = LX - 1; x <= LX + 2; x++) put(x, 23, 11);
// halo bloom (dithered ring)
for (let y = 10; y < 36; y++) for (let x = LX - 14; x < LX + 16; x++) {
  const d = Math.hypot(x - LX - .5, (y - 22) * 1.15);
  if (d > 4 && d < 13 && BAYER[y & 3][x & 3] < (1 - d / 13) * .5 && get(x, y) !== 0 && get(x, y) !== 11) {
    const g = get(x, y); put(x, y, (g === 6 || g === 7 || g === 1 || g === 2) ? 8 : 9);
  }
}

// ---- trash cans (right) ----
function can(x0, yb, h, lid) {
  for (let y = yb - h; y <= yb; y++) for (let x = x0; x < x0 + 9; x++) {
    let c;
    if (x === x0 || x === x0 + 8 || y === yb) c = 0;
    else {
      const ridge = ((y - (yb - h)) % 4 === 1);
      c = dith(x, y, 'can', .26 + (x - x0) * .03 + (ridge ? .18 : 0) + lampLight(x, y) * .35 - (x - x0 > 5 ? .12 : 0) + (x - x0 === 1 ? .25 : 0));
    }
    put(x, y, c);
  }
  if (lid) { for (let x = x0 - 1; x < x0 + 10; x++) { put(x, yb - h - 1, 0); put(x, yb - h - 2, dith(x, yb - h - 2, 'can', .45)); put(x, yb - h - 3, 0); } put(x0 + 4, yb - h - 4, 0); put(x0 + 3, yb - h - 4, 0); put(x0 + 5, yb - h - 4, 0); }
}
can(86, 104, 13, true);
can(77, 106, 12, false);
// knocked-off lid + spilled bag
for (let x = 70; x < 78; x++) put(x, 107, 0);
for (let x = 71; x < 77; x++) put(x, 106, dith(x, 106, 'can', .5));
for (let y = 99; y < 106; y++) for (let x = 78; x < 85; x++) {
  const d = Math.hypot((x - 81) / 3.6, (y - 103) / 3.4);
  if (d < 1) put(x, y, d > .8 ? 0 : dith(x, y, 'glass', .55 - d * .4));
}

// ---- sprites ----
// survivor faces right; zombie faces left
const SURV = {
 map: [
"..........KKK...........",
".........KwwwK..........",
".........KwwwK..........",
".......KKKRRRKKK........",
"......KRRRRRRRRRK.......",
".....KRRRRRRRRRRRK......",
".....KRRRRRRRRRRRRK.....",

"...KBGBGbKTTTYTKtSTK....",
"...KBBBBbKTTTYTKtSSSK...",
"...KbBBBbKTTTYTKSSSGK...",
"...KuBBBbKTTTYTTKSSGK...",
"...KbbBBbKTTTYTTKKKK....",

".....KKKKDDDDDDDK.......",
"........KDdDdDdDK.......",
"........KDDDDDDDDK......",
".........KLLKKLLK.......",
"........KLLK..KLSK......",

"........KzzK...KzzK.....",
".......KZZK....KZZK.....",
".......KOOK....KOOK.....",
"......KOOOK....KOOOK....",
"......KOOOOK...KOOOOK...",
"......KKKKKK...KKKKKK...",
 ],
 key: { K:0, w:5, R:16, r:17, H:3, h:4, S:12, s:9, E:0, e:11, p:16, m:17, A:21, u:20, T:18, t:19, Y:21, B:9, b:7, D:17, d:3, L:2, Z:21, z:16, O:7, X:8, x:7, G:5 }
};
const ZOMB = {
 map: [
"...........K.K.K............",
"..........KHKHKHK...........",
".........KHGGGGGHK..........",
"........KGGGGGGGGHK.........",
".......KGGGGgGGGGgHK........",

".......KqYkqGGqkYqgqH.......",
".......KqYYqGGqYYqggqH......",
".......KGqqGGqGqqggqKH......",
"......KGGGGGkGkGggqgK.H.....",
"......KGMMMMMMMMggqK..H.....",
"......KGMWxWWxWMxWqK........",
"......KgMMMMMMMMWqK.........",

"..KKK..KKKKKFFFFFFFFKK......",
".KGGGKKGBGBGKFMMMFFfffK.....",

"..........KKfffffK...KGGK...",
"..........KPPPPPPPPK..KKK...",
"..........KPPPPpPPPK........",
".........KPPPPKpPPPK........",
".........KPPPKKpPPPK........",
".........KPPPK.KpPPK........",
"........KPPPK..KpPPK........",
"........KPPPK..KpbqK........",
".......KPPPK...KqbqK........",
".......KPPK....KqbgK........",
"......KPPPK....KpPPK........",
"......KqqK.....KpPPK........",

 ],
 key: { K:0, H:20, G:13, g:14, q:15, M:0, Y:10, k:0, W:21, x:16, b:21, B:5, r:17, F:4, f:3, P:3, p:2, O:20 }
};

function shadow(cx, cy, rx, dirx) {
  // long shadow cast away from the lamp, dithered
  for (let y = cy - 2; y <= cy + 2; y++) for (let x = cx - rx; x <= cx + rx + 14; x++) {
    const sx = (x - cx - (dirx > 0 ? 7 : -7) * 0) ;
    const t = dirx > 0 ? (x - cx) : (cx - x);
    const along = Math.max(0, t);
    const d = Math.hypot((x - cx - dirx * along * .5) / (rx + along * .4), (y - cy) / 2.2);
    if (d < 1 && BAYER[y & 3][x & 3] < (1 - d) * 1.4 - along * .03) put(x, y, 0);
  }
}
// shadows: survivor is left of lamp -> shadow falls left; zombie right -> falls right
function longShadow(x0, x1, y, dir) {
  for (let x = x0; dir < 0 ? x >= x1 : x <= x1; x += dir) {
    const t = Math.abs(x - x0) / Math.abs(x1 - x0);
    for (let k = -2; k <= 2; k++) {
      const yy = y + k;
      const dens = (1 - t) * (1 - Math.abs(k) / 2.6) * 1.15;
      if (BAYER[yy & 3][x & 3] < dens) put(x, yy, Math.abs(k) === 2 ? 1 : 0);
    }
  }
}
longShadow(36, 8, 108, -1);
longShadow(72, 96, 108, 1);

function blit(spr, ox, oy, lampSide) {
  const h = spr.map.length, w = Math.max(...spr.map.map(r => r.length)); const m = spr.map.map(r => r.padEnd(w, '.'));
  const at = (x, y) => (x >= 0 && y >= 0 && x < w && y < h) ? m[y][x] : '.';
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = m[y][x]; if (ch === '.') continue;
    let c = spr.key[ch];
    if (!'KEMeYkWxbA'.includes(ch)) {
      // rim light on lamp side: pixel touching the outline that faces open space
      const n1 = at(x + lampSide, y), n2 = at(x + lampSide * 2, y);
      const up = at(x, y - 1), up2 = at(x, y - 2);
      if ((n1 === 'K' && n2 === '.') || (n1 === '.')) { c = brighten(c, 2); if (c === 11 && spr.key[ch] === 12) c = 10; }
      else if (up === 'K' && up2 === '.' && ((lampSide > 0 && x > w * .45) || (lampSide < 0 && x < w * .55))) c = brighten(c, 1);
      // cool moon rim on the far side
      const f1 = at(x - lampSide, y), f2 = at(x - lampSide * 2, y);
      if (f1 === 'K' && f2 === '.' && c !== 11) c = cool(c);
    }
    put(ox + x, oy + y, c);
  }
}
// brighten along a hand-picked warm ramp per material colour
const UP = { 2:3, 3:20, 4:21, 5:11, 7:8, 8:9, 9:10, 10:11, 12:10, 13:11, 14:13, 15:14, 16:9, 17:16, 18:10, 19:18, 20:21, 21:10, 1:2, 6:7 };
function brighten(c, n) { for (let i = 0; i < n; i++) c = UP[c] ?? c; return c; }
const COOL = { 2:3, 3:4, 4:5, 7:20, 9:21, 12:21, 13:5, 14:4, 15:3, 16:17, 18:5, 19:18, 21:5, 20:4, 1:3, 6:3 };
function cool(c) { return COOL[c] ?? c; }

blit(SURV, 16, 69, +1);
blit(ZOMB, 59, 70, -1);
// baseball bat (drawn as a tapered thick line so it reads clearly), with two nails
function bat(x0, y0, x1, y1) {
  const n = 40, pts = [];
  for (let i = 0; i <= n; i++) { const t = i / n; pts.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, .7 + t * 1.15]); }
  const inside = (x, y) => pts.some(([px, py, r]) => Math.hypot(x - px, y - py) <= r);
  const minx = Math.min(x0, x1) - 4, maxx = Math.max(x0, x1) + 4, miny = Math.min(y0, y1) - 4, maxy = Math.max(y0, y1) + 4;
  const m = {};
  for (let y = miny; y <= maxy; y++) for (let x = minx; x <= maxx; x++) if (inside(x + .0, y + .0)) m[x + ',' + y] = 1;
  for (let y = miny; y <= maxy; y++) for (let x = minx; x <= maxx; x++) {
    if (m[x + ',' + y]) continue;
    if (m[(x+1)+','+y] || m[(x-1)+','+y] || m[x+','+(y+1)] || m[x+','+(y-1)]) put(x, y, 0);
  }
  for (let y = miny; y <= maxy; y++) for (let x = minx; x <= maxx; x++) if (m[x + ',' + y]) {
    const edgeR = !m[(x+1)+','+y] || !m[x+','+(y-1)];
    const edgeL = !m[(x-1)+','+y];
    put(x, y, edgeR ? 10 : (edgeL ? 7 : 8));
  }
}
