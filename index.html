<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16130f">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dead Miles">
<title>Dead Miles: Homestead</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=8.1">
</head>
<body>
<div id="app">
  <header id="top" class="top"></header>
  <main id="main" class="main"></main>
  <nav class="tabs">
    <button data-t="today" class="on"><span>☀️</span>Today</button>
    <button data-t="farm"><span>🌱</span>Farm</button>
    <button data-t="run"><span>🔥</span>Run<i id="tabRunDot" class="dot" hidden></i></button>
    <button data-t="camp"><span>🏡</span>Camp</button>
    <button data-t="me"><span>👤</span>Me</button>
  </nav>
</div>
<div id="sheet" class="sheet" hidden onclick="if(event.target===this)closeSheet()"></div>
<div id="toasts" class="toasts"></div>
<script src="art.js?v=8.1"></script>
<script src="content.js?v=8.1"></script>
<script src="run.js?v=8.1"></script>
<script src="game.js?v=8.1"></script>
</body>
</html>
